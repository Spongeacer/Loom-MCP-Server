  l3: |-
    Typical LOOM workflow with examples:

    1. Start: read active-prompt (already in context). Check loom_task_list for existing work. Create/set active task if needed.

    2. Work: implement while watch daemon auto-tracks file changes.

    3. Record knowledge immediately when it forms (don't wait):
       - Decision: "Let's use JWT" → loom_decision_record right away. Why? In 3 sessions you'll forget why.
       - Preference: "I prefer small functions" → loom_memory_add immediately.
       - Convention: "All routes kebab-case" → loom_rule_create while fresh.

    4. Session wrap-up: 30-second mental scan for anything unrecorded.

    The cost of recording now is 30 seconds. The cost of not recording is 10 minutes of rediscovery in the next session.
