id: rule-loom-loom-governance
type: Rule
version: 1
namespace: project
content:
  l1_5: "[loom-governance] Before modifying artifacts referenced in governance or decisions slots, review those constraints first"
  l2: |-
    Before modifying artifacts referenced in governance or decisions slots, review those constraints first.
    Rationale: Governance and decisions represent stable, validated project knowledge. They exist to prevent "I forgot we decided that" errors. Temporary ideas from a single session should not override collective decisions without explicit discussion.

    Example: User says "let's switch to Express instead of Hono" → check decisions slot → find "Use Hono over Express" → surface this to user rather th
  l3: |-
    Scope: loom-governance
    Rule: Before modifying artifacts referenced in governance or decisions slots, review those constraints first.
    Rationale: Governance and decisions represent stable, validated project knowledge. They exist to prevent "I forgot we decided that" errors. Temporary ideas from a single session should not override collective decisions without explicit discussion.

    Example: User says "let's switch to Express instead of Hono" → check decisions slot → find "Use Hono over Express" → surface this to user rather than silently switching.
