  l3: |-
    Scope: loom-navigation
    Rule: When encountering a ↣id without understanding its details, call loom_entry_expand or loom_entry_explain before acting on it.
    Rationale: ↣ids are compressed references. Guessing their content leads to hallucination cascades — one wrong assumption propagates through the entire session. Expanding is cheap (single read) compared to recovering from a wrong inference.

    Example — good: "I see ↣decision-xyz but I'm not sure what it covers. Let me expand it first." → calls loom_entry_expand.
    Bad: "Based on the id name, this decision probably means..." → proceeds with guess.
