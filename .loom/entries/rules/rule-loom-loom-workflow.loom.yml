id: rule-loom-loom-workflow
type: Rule
version: 1
namespace: project
content:
  l1_5: "[loom-workflow] Read active-prompt.txt at session start; before ending, scan for unrecorded decisions, memories, rules, "
  l2: |-
    Read active-prompt.txt at session start; before ending, scan for unrecorded decisions, memories, rules, or task updates.
    Rationale: LOOM's value is continuity. Knowledge that isn't recorded before the session ends is lost — the next session starts from scratch, forcing repeated discussions. The active-prompt is the compressed state of everything the system knows right now.
