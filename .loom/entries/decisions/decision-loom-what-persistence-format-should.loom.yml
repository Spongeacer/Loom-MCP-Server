id: decision-loom-what-persistence-format-should
type: Decision
version: 1
namespace: project
content:
  l1_5: What persistence format should LOOM use for entries? → One YAML file per entry in .loom/entries/<type>/
  l2: |-
    What persistence format should LOOM use for entries?
    Chosen: One YAML file per entry in .loom/entries/<type>/
    Rationale: Human-readable, git-diffable, no merge conflicts since each entry is independent. Atomic writes via temp-file rename prevent corruption. Easy to inspect and manually edit during debugging. The filesystem is the single source of truth — no database to manage, no migration scripts, version-controllable.
  l3: |-
    Question: What persistence format should LOOM use for entries?
    Chosen: One YAML file per entry in .loom/entries/<type>/
    Rationale: Human-readable, git-diffable, no merge conflicts since each entry is independent. Atomic writes via temp-file rename prevent corruption. Easy to inspect and manually edit during debugging. The filesystem is the single source of truth — no database to manage, no migration scripts, version-controllable.
    Impact: packages/loom-core/src/store/fs-adapter.ts, .loom/entries/
