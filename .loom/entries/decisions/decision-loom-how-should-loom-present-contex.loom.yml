content:
  l1_5: How should LOOM present context to the AI? → Slot-based XML prompt with static-to-dynamic ordering
  l2: |-
    How should LOOM present context to the AI?
    Chosen: Slot-based XML prompt with static-to-dynamic ordering
    Rationale: Static slots (protocol, governance, decisions) change rarely and sit at the top for KV-cache / prompt-cache efficiency. Dynamic slots (task, working_set, risks) at the bottom minimize prefix invalidation when they change. All internal lists sorted by ID to prevent order jitter from breaking cache. This ordering maximizes cache hit rate across multiple sessions.
