id: rule-auth-style
type: Rule
version: 1
namespace: project
content:
  l1_5: JWT+RBAC统一走中间件
  l2: 所有JWT+RBAC认证必须统一走中间件，禁止在业务逻辑中自行解析token
  l3: |
    1. 所有请求的身份认证统一由 src/auth/middleware.ts 处理。
    2. RBAC 权限判定必须在 middleware 层完成。
    3. 禁止在 controller / service 中直接读取 Authorization header。
